# U.ZU Engine verification (BACKLOG B-107): the editor build with tests and the full
# unit test suite on every push to the working branches, plus the agent tool self-tests.
# Only this workflow is meant to run on the fork. The upstream workflows ("🔗 GHA",
# runner.yml) stay off: set the repository variable DISABLE_GODOT_CI to true (their
# own switch), so no upstream file needs to change.
name: U.ZU verify

on:
  push:
    branches: [ai-native, "claude/**", "agent/**", "rehearsal/**"]
  workflow_dispatch:

concurrency:
  group: uzu-verify-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: Editor build, unit tests, tool self-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Setup system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-bin

      - name: Restore the SCons cache
        uses: actions/cache/restore@v6
        with:
          path: .scons_cache
          key: uzu-editor-tests-${{ github.sha }}
          restore-keys: uzu-editor-tests-

      - name: Build the editor with tests
        id: build
        run: |
          start=$(date +%s)
          scons platform=linuxbsd target=editor tests=yes accesskit=no arch=x86_64 \
            cache_path=.scons_cache cache_limit=7 -j"$(nproc)"
          echo "seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"

      - name: Save the SCons cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .scons_cache
          key: uzu-editor-tests-${{ github.sha }}

      - name: Unit tests
        id: tests
        run: |
          start=$(date +%s)
          bin/godot.linuxbsd.editor.x86_64 --headless --test --force-colors 2>&1 | tee tests.log
          status=${PIPESTATUS[0]}
          echo "seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"
          grep -E "\[doctest\] (test cases|assertions)" tests.log >> "$GITHUB_STEP_SUMMARY" || true
          exit "$status"

      - name: Agent tool self-tests
        run: python3 ai_loop/uzu.py selftest all

      # B-110: the binary is published only after the build, the unit tests and the tool
      # self-tests have passed (a failed step skips this one), so any machine can download
      # a verified editor instead of building it.
      - name: Upload the verified editor binary
        uses: actions/upload-artifact@v7
        with:
          name: uzu-engine-editor-linux-${{ github.sha }}
          path: bin/godot.linuxbsd.editor.x86_64
          retention-days: 30
          if-no-files-found: error

      - name: Timing
        if: always()
        run: |
          {
            echo "### Timing"
            echo "- build: ${{ steps.build.outputs.seconds }} s"
            echo "- unit tests: ${{ steps.tests.outputs.seconds }} s"
          } >> "$GITHUB_STEP_SUMMARY"

  windows-editor:
    name: Windows x64 editor build and unit tests
    # Build automatically on the integration branch; other branches can opt in via Run workflow.
    if: github.ref == 'refs/heads/ai-native' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Restore the Windows SCons cache
        uses: actions/cache/restore@v6
        with:
          path: .scons_cache_windows
          key: uzu-editor-tests-windows-x64-v1-${{ github.sha }}
          restore-keys: uzu-editor-tests-windows-x64-v1-

      - name: Build and package the Windows editor
        shell: pwsh
        run: |
          python -m SCons platform=windows target=editor arch=x86_64 tests=yes d3d12=no accesskit=no angle=no cache_path=.scons_cache_windows cache_limit=2 -j $env:NUMBER_OF_PROCESSORS
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $package = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'uzu-editor-windows-x64')
          Copy-Item -LiteralPath @('bin/godot.windows.editor.x86_64.exe', 'bin/godot.windows.editor.x86_64.console.exe', 'LICENSE.txt', 'COPYRIGHT.txt') -Destination $package.FullName

      - name: Upload the Windows editor
        uses: actions/upload-artifact@v7
        with:
          name: uzu-engine-editor-windows-x64-${{ github.sha }}
          path: ${{ runner.temp }}/uzu-editor-windows-x64/
          retention-days: 30
          if-no-files-found: error

      - name: Save the Windows SCons cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .scons_cache_windows
          key: uzu-editor-tests-windows-x64-v1-${{ github.sha }}

      - name: Windows unit tests
        shell: pwsh
        run: |
          & ./bin/godot.windows.editor.x86_64.console.exe --headless --test
          exit $LASTEXITCODE
